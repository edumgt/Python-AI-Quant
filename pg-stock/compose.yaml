name: pg-stock

services:
  # Private 이미지에서 물리 PostgreSQL 데이터 디렉터리를 named volume에 초기화한다.
  # PG_VERSION이 있으면 이미 초기화된 볼륨이므로 데이터를 덮어쓰지 않는다.
  seed:
    image: edumgt/pg-stock-data-seed:2026-09-04
    pull_policy: always
    volumes:
      - pg_stock_data:/data
    restart: "no"

  db:
    # 백업을 생성한 PostgreSQL 18.6과 같은 공개 Official Image를 고정한다.
    image: postgres:18.6
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admin}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_stock_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pg_stock_data:
    name: pg_stock_data
